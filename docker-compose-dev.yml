# Docker compose DEV feito para o desenvolvimento
# mudanças são sincronizadas no site imediatamente
services:
  painel:
    build: .
    ports:
    - "3000:3000"
    depends_on:
      - db
    command: npm run dev
    volumes:
      - .:/app
      - /app/node_modules

  db:
    image: postgis/postgis:18-3.6
    ports: 
    - "5432:5432"
    environment:
      POSTGRES_USER: oasis2_user     
      POSTGRES_PASSWORD: oasis22026   
      POSTGRES_DB: oasis_seguranca          
    volumes:
      - ./bd:/docker-entrypoint-initdb.d
      - db-data:/var/lib/postgresql

volumes:
  db-data: